name: CI/CD - service-polices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/service-polices

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov

      - name: Lancer les tests unitaires avec couverture
        run: python -m pytest tests/ -v --cov=app --cov-report=xml

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/service-polices/coverage.xml

  sonarqube_analysis:
    name: Analyse de code SonarQube
    runs-on: [self-hosted, sonarqube]
    needs: test
    defaults:
      run:
        working-directory: services/service-polices

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer les dépendances et générer la couverture
        run: |
          python3.12 -m venv venv_ci
          source venv_ci/bin/activate
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov
          python -m pytest tests/ --cov=app --cov-report=xml

      - name: Lancer l'analyse SonarQube
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          projectBaseDir: services/service-polices
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sca_analysis:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances du service
        working-directory: services/service-polices
        run: pip install -r requirements.txt

      - name: Installer pip-audit
        run: pip install pip-audit

      - name: Scanner les dépendances (pip-audit)
        working-directory: services/service-polices
        run: pip-audit -r requirements.txt
