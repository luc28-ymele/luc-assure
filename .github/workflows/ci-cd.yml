name: CI/CD - service-polices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/service-polices

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Lancer les tests unitaires
        run: python -m pytest tests/ -v

  sonarqube_analysis:
    name: Analyse de code SonarQube
    runs-on: [self-hosted, sonarqube]
    needs: test
    defaults:
      run:
        working-directory: services/service-polices

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lancer l'analyse SonarQube
        uses: sonarsource/sonarqube-scan-action@v5
        with:
          projectBaseDir: services/service-polices
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
